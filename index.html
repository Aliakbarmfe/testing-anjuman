<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Bars</title>
  <style>
    /* استایل‌های پایه و پس‌زمینه کارت */
    body {
      background-color: #080d19;
      font-family: Tahoma, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #fff;
    }

    .card {
      background-color: #0b1329;
      border: 1px solid #1a294d;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* استایل بخش نوارها */
    .progress-group {
      margin-bottom: 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .percent {
      color: #00d2ff;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #16223d;
      border-radius: 10px;
      overflow: hidden;
      direction: ltr; /* جهت پر شدن از چپ به راست مطابق تصویر */
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 10px;
      /* انیمیشن طی ۲ ثانیه اجرا می‌شود و در ۱۰۰٪ باقی می‌ماند */
      animation: fillUp 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* رنگ‌های طیفی برای هر نوار */
    .fill-1 {
      background: linear-gradient(90deg, #00d2ff, #0072ff);
    }

    .fill-2 {
      background: linear-gradient(90deg, #00f2fe, #4facfe);
    }

    .fill-3 {
      background: linear-gradient(90deg, #7F00FF, #E100FF);
    }

    /* کلیدهای انیمیشن از 0 تا 100 درصد */
    @keyframes fillUp {
      from {
        width: 0%;
      }
      to {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- آیتم اول -->
    <div class="progress-group">
      <div class="progress-info">
        <span class="percent">100%</span>
        <span class="label">رندرینگ جلوه‌های بصری</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-fill fill-1"></div>
      </div>
    </div>

    <!-- آیتم دوم -->
    <div class="progress-group">
      <div class="progress-info">
        <span class="percent">100%</span>
        <span class="label">پیشرفت دوره جامع تدوین</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-fill fill-2"></div>
      </div>
    </div>

    <!-- آیتم سوم -->
    <div class="progress-group">
      <div class="progress-info">
        <span class="percent">100%</span>
        <span class="label">تکمیل پروژه‌های فعال</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-fill fill-3"></div>
      </div>
    </div>
  </div>

</body>
</html>
